name: Alice website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/characters/alice/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build introduction page
        run: python3 website/build.py
      - name: Check JavaScript syntax
        run: node --check dist/site/app.js
      - name: Prepare browser checks
        run: |
          python3 -m pip install playwright==1.65.2
          python3 -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts
          cp assets/fonts/*.otf ~/.local/share/fonts/
          fc-cache -f
      - name: Check responsive layout and interactions
        run: python3 website/check.py
      - name: Save page screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Alice-website-preview
          path: dist/website-preview
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
