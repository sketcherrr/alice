name: alice_companion
description: Alice — a local-first character companion.
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.8.1
  record: 7.2.0
  crypto: 3.0.8
  file_selector: 1.1.0
  nm: 0.6.0
  dbus: 0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/character.png
    - assets/animations/
    - assets/audio/
    - assets/OFL.txt
  fonts:
    - family: Noto Sans CJK SC
      fonts:
        - asset: assets/NotoSansCJKsc-Regular.otf

